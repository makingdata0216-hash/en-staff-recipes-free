K JP,sans-serif">ガラスの深皿にディッシャーでアイスをのせる。</text><rect x="70" y="848" width="55" height="52" rx="26" fill="#a51e29"/><text x="86" y="886" font-size="30" font-weight="700" fill="#fff" font-family="Noto Sans CJK JP,sans-serif">2</text><text x="148" y="878" font-size="32" font-weight="400" fill="#202b2c" font-family="Noto Sans CJK JP,sans-serif">フルグラを少量入れ、チョコソースをかける。</text><rect x="70" y="922" width="55" height="52" rx="26" fill="#a51e29"/><text x="86" y="960" font-size="30" font-weight="700" fill="#fff" font-family="Noto Sans CJK JP,sans-serif">3</text><text x="148" y="952" font-size="32" font-weight="400" fill="#202b2c" font-family="Noto Sans CJK JP,sans-serif">最後にビスケットを添えて提供する。</text><rect x="50" y="1035" width="980" height="65" rx="12" fill="#a51e29"/><text x="80" y="1080" font-size="35" font-weight="700" fill="#fff" font-family="Noto Sans CJK JP,sans-serif">盛り付け・提供</text><text x="80" y="1126" font-size="32" font-weight="400" fill="#202b2c" font-family="Noto Sans CJK JP,sans-serif">ガラスの深皿。</text><rect x="50" y="1206" width="980" height="65" rx="12" fill="#a51e29"/><text x="80" y="1251" font-size="35" font-weight="700" fill="#fff" font-family="Noto Sans CJK JP,sans-serif">注意点</text><text x="80" y="1300" font-size="32" font-weight="400" fill="#202b2c" font-family="Noto Sans CJK JP,sans-serif">・アイス用ディッシャーは水でぬらす。フルグラを入れすぎ</text><text x="80" y="1347" font-size="32" font-weight="400" fill="#202b2c" font-family="Noto Sans CJK JP,sans-serif">ない。</text><text x="58" y="1453" font-size="23" font-weight="400" fill="#6b7882" font-family="Noto Sans CJK JP,sans-serif">Shisha Cafe &amp; Bar en ・ スタッフ用</text></svg>