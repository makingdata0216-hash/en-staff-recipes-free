<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1479" viewBox="0 0 1080 1479"><rect width="1080" height="1479" fill="#ffffff"/><rect x="0" y="0" width="1080" height="190" rx="0" fill="#17262a"/><rect x="0" y="0" width="1080" height="18" rx="0" fill="#b62d32"/><text x="52" y="75" fill="#ffffff" font-size="36" font-weight="700" font-family="Noto Sans CJK JP, sans-serif">en  |  FOOD RECIPE</text><text x="52" y="153" fill="#ffffff" font-size="54" font-weight="700" font-family="Noto Sans CJK JP, sans-serif">05  枝豆</text><rect x="50" y="224" width="980" height="106" rx="18" fill="#f6e6e6"/><text x="76" y="264" fill="#a51e29" font-size="28" font-weight="700" font-family="Noto Sans CJK JP, sans-serif">加熱・調理条件</text><text x="76" y="309" fill="#1b2530" font-size="30" font-weight="700" font-family="Noto Sans CJK JP, sans-serif">700W・1分40秒</text><rect x="50" y="378" width="980" height="66" rx="12" fill="#b62d32"/><text x="77" y="423" fill="#fff" font-size="34" font-weight="700" font-family="Noto Sans CJK JP, sans-serif">材料・分量</text><text x="80" y="474" fill="#1b2530" font-size="31" font-weight="400" font-family="Noto Sans CJK JP, sans-serif">・冷凍枝豆 150g</text><text x="80" y="533" fill="#1b2530" font-size="31" font-weight="400" font-family="Noto Sans CJK JP, sans-serif">・塩 2〜4つまみ</text><rect x="50" y="614" width="980" height="66" rx="12" fill="#b62d32"/><text x="77" y="659" fill="#fff" font-size="34" font-weight="700" font-family="Noto Sans CJK JP, sans-serif">作り方</text><rect x="70" y="673" width="52" height="52" rx="26" fill="#b62d32"/><text x="86" y="710" fill="white" font-size="29" font-weight="700" font-family="Noto Sans CJK JP, sans-serif">1</text><text x="145" y="702" fill="#1b2530" font-size="31" font-weight="400" font-family="Noto Sans CJK JP, sans-serif">耐熱容器に冷凍枝豆150gを入れる。</text><rect x="70" y="752" width="52" height="52" rx="26" fill="#b62d32"/><text x="86" y="789" fill="white" font-size="29" font-weight="700" font-family="Noto Sans CJK JP, sans-serif">2</text><text x="145" y="781" fill="#1b2530" font-size="31" font-weight="400" font-family="Noto Sans CJK JP, sans-serif">電子レンジ700Wで1分40秒加熱。不足時は追加加熱す</text><text x="145" y="827" fill="#1b2530" font-size="31" font-weight="400" font-family="Noto Sans CJK JP, sans-serif">る。</text><rect x="70" y="877" width="52" height="52" rx="26" fill="#b62d32"/><text x="86" y="914" fill="white" font-size="29" font-weight="700" font-family="Noto Sans CJK JP, sans-serif">3</text><text x="145" y="906" fill="#1b2530" font-size="31" font-weight="400" font-family="Noto Sans CJK JP, sans-serif">水気を切り、塩を2〜4つまみかける。</text><rect x="70" y="956" width="52" height="52" rx="26" fill="#b62d32"/><text x="86" y="993" fill="white" font-size="29" font-weight="700" font-family="Noto Sans CJK JP, sans-serif">4</text><text x="145" y="985" fill="#1b2530" font-size="31" font-weight="400" font-family="Noto Sans CJK JP, sans-serif">木の器に盛り、下に黒い小皿を敷いて提供する。</text><rect x="50" y="1068" width="980" height="66" rx="12" fill="#b62d32"/><text x="77" y="1113" fill="#fff" font-size="34" font-weight="700" font-family="Noto Sans CJK JP, sans-serif">盛り付け・提供</text><text x="80" y="1164" fill="#1b2530" font-size="31" font-weight="400" font-family="Noto Sans CJK JP, sans-serif">木の器＋黒い小皿。</text><rect x="50" y="1245" width="980" height="66" rx="12" fill="#b62d32"/><text x="77" y="1290" fill="#fff" font-size="34" font-weight="700" font-family="Noto Sans CJK JP, sans-serif">注意点</text><text x="80" y="1340" fill="#1b2530" font-size="31" font-weight="400" font-family="Noto Sans CJK JP, sans-serif">・塩の振りすぎに注意。</text><text x="60" y="1444" fill="#6b7980" font-size="24" font-family="Noto Sans CJK JP,sans-serif">Shisha Cafe &amp; Bar en ・ スタッフ用</text></svg>