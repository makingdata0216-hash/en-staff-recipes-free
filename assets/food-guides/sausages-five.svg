"#1b2530" font-size="31" font-weight="400" font-family="Noto Sans CJK JP, sans-serif">る。</text><rect x="70" y="857" width="52" height="52" rx="26" fill="#b62d32"/><text x="86" y="894" fill="white" font-size="29" font-weight="700" font-family="Noto Sans CJK JP, sans-serif">2</text><text x="145" y="886" fill="#1b2530" font-size="31" font-weight="400" font-family="Noto Sans CJK JP, sans-serif">中まで熱が入ったら湯を捨てる。</text><rect x="70" y="936" width="52" height="52" rx="26" fill="#b62d32"/><text x="86" y="973" fill="white" font-size="29" font-weight="700" font-family="Noto Sans CJK JP, sans-serif">3</text><text x="145" y="965" fill="#1b2530" font-size="31" font-weight="400" font-family="Noto Sans CJK JP, sans-serif">オリーブオイルをひと回しかけ、焼き目が付くまで炒める。</text><rect x="70" y="1015" width="52" height="52" rx="26" fill="#b62d32"/><text x="86" y="1052" fill="white" font-size="29" font-weight="700" font-family="Noto Sans CJK JP, sans-serif">4</text><text x="145" y="1044" fill="#1b2530" font-size="31" font-weight="400" font-family="Noto Sans CJK JP, sans-serif">木の板にスキレットをのせ、パセリを振る。</text><rect x="70" y="1094" width="52" height="52" rx="26" fill="#b62d32"/><text x="86" y="1131" fill="white" font-size="29" font-weight="700" font-family="Noto Sans CJK JP, sans-serif">5</text><text x="145" y="1123" fill="#1b2530" font-size="31" font-weight="400" font-family="Noto Sans CJK JP, sans-serif">ココットにケチャップと粒マスタードを添える。</text><rect x="50" y="1206" width="980" height="66" rx="12" fill="#b62d32"/><text x="77" y="1251" fill="#fff" font-size="34" font-weight="700" font-family="Noto Sans CJK JP, sans-serif">盛り付け・提供</text><text x="80" y="1302" fill="#1b2530" font-size="31" font-weight="400" font-family="Noto Sans CJK JP, sans-serif">スキレット＋専用木板。調味料はココット。</text><rect x="50" y="1383" width="980" height="66" rx="12" fill="#b62d32"/><text x="77" y="1428" fill="#fff" font-size="34" font-weight="700" font-family="Noto Sans CJK JP, sans-serif">注意点</text><text x="80" y="1478" fill="#1b2530" font-size="31" font-weight="400" font-family="Noto Sans CJK JP, sans-serif">・ソーセージの皮が割れないよう炒める。</text><text x="60" y="1582" fill="#6b7980" font-size="24" font-family="Noto Sans CJK JP,sans-serif">Shisha Cafe &amp; Bar en ・ スタッフ用</text></svg>