<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1555" viewBox="0 0 1080 1555"><rect width="1080" height="1555" fill="white"/><rect x="0" y="0" width="1080" height="193" rx="0" fill="#17262a"/><rect x="0" y="0" width="1080" height="17" rx="0" fill="#a51e29"/><text x="55" y="75" font-size="35" font-weight="700" fill="#fff" font-family="Noto Sans CJK JP,sans-serif">en | FOOD RECIPE</text><text x="52" y="155" font-size="53" font-weight="700" fill="#fff" font-family="Noto Sans CJK JP,sans-serif">12  ヨアジョン</text><rect x="50" y="225" width="980" height="110" rx="16" fill="#fbe8e8"/><text x="80" y="270" font-size="28" font-weight="700" fill="#9a1924" font-family="Noto Sans CJK JP,sans-serif">加熱・調理条件</text><text x="80" y="317" font-size="32" font-weight="700" fill="#202b2c" font-family="Noto Sans CJK JP,sans-serif">加熱なし</text><rect x="50" y="380" width="980" height="65" rx="12" fill="#a51e29"/><text x="80" y="425" font-size="35" font-weight="700" fill="#fff" font-family="Noto Sans CJK JP,sans-serif">材料・分量</text><text x="80" y="476" font-size="32" font-weight="400" fill="#202b2c" font-family="Noto Sans CJK JP,sans-serif">・グリークヨーグルト 80g</text><text x="80" y="530" font-size="32" font-weight="400" fill="#202b2c" font-family="Noto Sans CJK JP,sans-serif">・アイスベース 80g</text><text x="80" y="584" font-size="32" font-weight="400" fill="#202b2c" font-family="Noto Sans CJK JP,sans-serif">・バナナ・はちみつ・フルグラ</text><text x="80" y="638" font-size="32" font-weight="400" fill="#202b2c" font-family="Noto Sans CJK JP,sans-serif">・冷凍いちご／キウイ／マンゴー／ベリー</text><rect x="50" y="713" width="980" height="65" rx="12" fill="#a51e29"/><text x="80" y="758" font-size="35" font-weight="700" fill="#fff" font-family="Noto Sans CJK JP,sans-serif">作り方</text><rect x="70" y="774" width="55" height="52" rx="26" fill="#a51e29"/><text x="86" y="812" font-size="30" font-weight="700" fill="#fff" font-family="Noto Sans CJK JP,sans-serif">1</text><text x="148" y="804" font-size="32" font-weight="400" fill="#202b2c" font-family="Noto Sans CJK JP,sans-serif">ヨーグルト80gとアイスベース80gをボウルで混ぜる</text><text x="148" y="851" font-size="32" font-weight="400" fill="#202b2c" font-family="Noto Sans CJK JP,sans-serif">。</text><rect x="70" y="895" width="55" height="52" rx="26" fill="#a51e29"/><text x="86" y="933" font-size="30" font-weight="700" fill="#fff" font-family="Noto Sans CJK JP,sans-serif">2</text><text x="148" y="925" font-size="32" font-weight="400" fill="#202b2c" font-family="Noto Sans CJK JP,sans-serif">デザート用ディッシャーで3個分を皿によそう。</text><rect x="70" y="969" width="55" height="52" rx="26" fill="#a51e29"/><text x="86" y="1007" font-size="30" font-weight="700" fill="#fff" font-family="Noto Sans CJK JP,sans-serif">3</text><text x="148" y="999" font-size="32" font-weight="400" fill="#202b2c" font-family="Noto Sans CJK JP,sans-serif">冷凍フルーツと切ったバナナを盛り付ける。</text><rect x="70" y="1043" width="55" height="52" rx="26" fill="#a51e29"/><text x="86" y="1081" font-size="30" font-weight="700" fill="#fff" font-family="Noto Sans CJK JP,sans-serif">4</text><text x="148" y="1073" font-size="32" font-weight="400" fill="#202b2c" font-family="Noto Sans CJK JP,sans-serif">フルグラを少量添え、はちみつをかける。</text><rect x="50" y="1156" width="980" height="65" rx="12" fill="#a51e29"/><text x="80" y="1201" font-size="35" font-weight="700" fill="#fff" font-family="Noto Sans CJK JP,sans-serif">盛り付け・提供</text><text x="80" y="1247" font-size="32" font-weight="400" fill="#202b2c" font-family="Noto Sans CJK JP,sans-serif">木の皿に彩りよく盛る。</text><rect x="50" y="1327" width="980" height="65" rx="12" fill="#a51e29"/><text x="80" y="1372" font-size="35" font-weight="700" fill="#fff" font-family="Noto Sans CJK JP,sans-serif">注意点</text><text x="80" y="1421" font-size="32" font-weight="400" fill="#202b2c" font-family="Noto Sans CJK JP,sans-serif">・混ぜすぎ・溶けに注意。盛り付けは素早く。</text><text x="58" y="1527" font-size="23" font-weight="400" fill="#6b7882" font-family="Noto Sans CJK JP,sans-serif">Shisha Cafe &amp; Bar en ・ スタッフ用</text></svg>