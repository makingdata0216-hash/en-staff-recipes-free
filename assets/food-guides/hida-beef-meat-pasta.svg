<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1643" viewBox="0 0 1080 1643"><rect width="1080" height="1643" fill="#ffffff"/><rect x="0" y="0" width="1080" height="190" rx="0" fill="#17262a"/><rect x="0" y="0" width="1080" height="18" rx="0" fill="#b62d32"/><text x="52" y="75" fill="#ffffff" font-size="36" font-weight="700" font-family="Noto Sans CJK JP, sans-serif">en  |  FOOD RECIPE</text><text x="52" y="153" fill="#ffffff" font-size="54" font-weight="700" font-family="Noto Sans CJK JP, sans-serif">01  飛騨牛ミートパスタ</text><rect x="50" y="224" width="980" height="106" rx="18" fill="#f6e6e6"/><text x="76" y="264" fill="#a51e29" font-size="28" font-weight="700" font-family="Noto Sans CJK JP, sans-serif">加熱・調理条件</text><text x="76" y="309" fill="#1b2530" font-size="30" font-weight="700" font-family="Noto Sans CJK JP, sans-serif">パスタ1分ゆで・ソース中火</text><rect x="50" y="378" width="980" height="66" rx="12" fill="#b62d32"/><text x="77" y="423" fill="#fff" font-size="34" font-weight="700" font-family="Noto Sans CJK JP, sans-serif">材料・分量</text><text x="80" y="474" fill="#1b2530" font-size="31" font-weight="400" font-family="Noto Sans CJK JP, sans-serif">・冷凍ミートソース</text><text x="80" y="533" fill="#1b2530" font-size="31" font-weight="400" font-family="Noto Sans CJK JP, sans-serif">・冷凍パスタ麺：1袋</text><text x="80" y="592" fill="#1b2530" font-size="31" font-weight="400" font-family="Noto Sans CJK JP, sans-serif">・塩 大さじ1杯（ゆで湯）</text><text x="80" y="651" fill="#1b2530" font-size="31" font-weight="400" font-family="Noto Sans CJK JP, sans-serif">・粉チーズ</text><rect x="50" y="732" width="980" height="66" rx="12" fill="#b62d32"/><text x="77" y="777" fill="#fff" font-size="34" font-weight="700" font-family="Noto Sans CJK JP, sans-serif">作り方</text><rect x="70" y="791" width="52" height="52" rx="26" fill="#b62d32"/><text x="86" y="828" fill="white" font-size="29" font-weight="700" font-family="Noto Sans CJK JP, sans-serif">1</text><text x="145" y="820" fill="#1b2530" font-size="31" font-weight="400" font-family="Noto Sans CJK JP, sans-serif">お湯を沸かし、ミートソースを湯せんで解凍する。</text><rect x="70" y="870" width="52" height="52" rx="26" fill="#b62d32"/><text x="86" y="907" fill="white" font-size="29" font-weight="700" font-family="Noto Sans CJK JP, sans-serif">2</text><text x="145" y="899" fill="#1b2530" font-size="31" font-weight="400" font-family="Noto Sans CJK JP, sans-serif">塩を入れ、冷凍パスタ麺1袋を1分ゆでる。</text><rect x="70" y="949" width="52" height="52" rx="26" fill="#b62d32"/><text x="86" y="986" fill="white" font-size="29" font-weight="700" font-family="Noto Sans CJK JP, sans-serif">3</text><text x="145" y="978" fill="#1b2530" font-size="31" font-weight="400" font-family="Noto Sans CJK JP, sans-serif">麺をザルにあげて水気を切る。</text><rect x="70" y="1028" width="52" height="52" rx="26" fill="#b62d32"/><text x="86" y="1065" fill="white" font-size="29" font-weight="700" font-family="Noto Sans CJK JP, sans-serif">4</text><text x="145" y="1057" fill="#1b2530" font-size="31" font-weight="400" font-family="Noto Sans CJK JP, sans-serif">解凍したソースをフライパンで中火で温め、麺を加えて絡め</text><text x="145" y="1103" fill="#1b2530" font-size="31" font-weight="400" font-family="Noto Sans CJK JP, sans-serif">る。</text><rect x="50" y="1186" width="980" height="66" rx="12" fill="#b62d32"/><text x="77" y="1231" fill="#fff" font-size="34" font-weight="700" font-family="Noto Sans CJK JP, sans-serif">盛り付け・提供</text><text x="80" y="1282" fill="#1b2530" font-size="31" font-weight="400" font-family="Noto Sans CJK JP, sans-serif">黒い大皿。トングで丸く盛り、残った挽肉を上に。粉チーズを線</text><text x="80" y="1328" fill="#1b2530" font-size="31" font-weight="400" font-family="Noto Sans CJK JP, sans-serif">状にかける。</text><rect x="50" y="1409" width="980" height="66" rx="12" fill="#b62d32"/><text x="77" y="1454" fill="#fff" font-size="34" font-weight="700" font-family="Noto Sans CJK JP, sans-serif">注意点</text><text x="80" y="1504" fill="#1b2530" font-size="31" font-weight="400" font-family="Noto Sans CJK JP, sans-serif">・ソースが温まってから麺を加える。</text><text x="60" y="1608" fill="#6b7980" font-size="24" font-family="Noto Sans CJK JP,sans-serif">Shisha Cafe &amp; Bar en ・ スタッフ用</text></svg>