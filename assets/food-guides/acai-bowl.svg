<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1656" viewBox="0 0 1080 1656"><rect width="1080" height="1656" fill="white"/><rect x="0" y="0" width="1080" height="193" rx="0" fill="#17262a"/><rect x="0" y="0" width="1080" height="17" rx="0" fill="#a51e29"/><text x="55" y="75" font-size="35" font-weight="700" fill="#fff" font-family="Noto Sans CJK JP,sans-serif">en | FOOD RECIPE</text><text x="52" y="155" font-size="53" font-weight="700" fill="#fff" font-family="Noto Sans CJK JP,sans-serif">17  アサイーボウル</text><rect x="50" y="225" width="980" height="110" rx="16" fill="#fbe8e8"/><text x="80" y="270" font-size="28" font-weight="700" fill="#9a1924" font-family="Noto Sans CJK JP,sans-serif">加熱・調理条件</text><text x="80" y="317" font-size="32" font-weight="700" fill="#202b2c" font-family="Noto Sans CJK JP,sans-serif">加熱なし（半解凍）</text><rect x="50" y="380" width="980" height="65" rx="12" fill="#a51e29"/><text x="80" y="425" font-size="35" font-weight="700" fill="#fff" font-family="Noto Sans CJK JP,sans-serif">材料・分量</text><text x="80" y="476" font-size="32" font-weight="400" fill="#202b2c" font-family="Noto Sans CJK JP,sans-serif">・アサイーの素 半分</text><text x="80" y="530" font-size="32" font-weight="400" fill="#202b2c" font-family="Noto Sans CJK JP,sans-serif">・グリークヨーグルト 大さじ2</text><text x="80" y="584" font-size="32" font-weight="400" fill="#202b2c" font-family="Noto Sans CJK JP,sans-serif">・バナナ・はちみつ・フルグラ</text><text x="80" y="638" font-size="32" font-weight="400" fill="#202b2c" font-family="Noto Sans CJK JP,sans-serif">・冷凍いちご／キウイ／マンゴー／ベリー</text><text x="80" y="692" font-size="32" font-weight="400" fill="#202b2c" font-family="Noto Sans CJK JP,sans-serif">・ビスケット</text><rect x="50" y="767" width="980" height="65" rx="12" fill="#a51e29"/><text x="80" y="812" font-size="35" font-weight="700" fill="#fff" font-family="Noto Sans CJK JP,sans-serif">作り方</text><rect x="70" y="828" width="55" height="52" rx="26" fill="#a51e29"/><text x="86" y="866" font-size="30" font-weight="700" fill="#fff" font-family="Noto Sans CJK JP,sans-serif">1</text><text x="148" y="858" font-size="32" font-weight="400" fill="#202b2c" font-family="Noto Sans CJK JP,sans-serif">ミキサーでアサイーの素半分とヨーグルト大さじ2を混ぜ</text><text x="148" y="905" font-size="32" font-weight="400" fill="#202b2c" font-family="Noto Sans CJK JP,sans-serif">る。</text><rect x="70" y="949" width="55" height="52" rx="26" fill="#a51e29"/><text x="86" y="987" font-size="30" font-weight="700" fill="#fff" font-family="Noto Sans CJK JP,sans-serif">2</text><text x="148" y="979" font-size="32" font-weight="400" fill="#202b2c" font-family="Noto Sans CJK JP,sans-serif">木の皿に移し、フルーツや切ったバナナを盛る。</text><rect x="70" y="1023" width="55" height="52" rx="26" fill="#a51e29"/><text x="86" y="1061" font-size="30" font-weight="700" fill="#fff" font-family="Noto Sans CJK JP,sans-serif">3</text><text x="148" y="1053" font-size="32" font-weight="400" fill="#202b2c" font-family="Noto Sans CJK JP,sans-serif">フルグラを添えてはちみつをかける。</text><rect x="70" y="1097" width="55" height="52" rx="26" fill="#a51e29"/><text x="86" y="1135" font-size="30" font-weight="700" fill="#fff" font-family="Noto Sans CJK JP,sans-serif">4</text><text x="148" y="1127" font-size="32" font-weight="400" fill="#202b2c" font-family="Noto Sans CJK JP,sans-serif">最後にビスケットをのせる。</text><rect x="50" y="1210" width="980" height="65" rx="12" fill="#a51e29"/><text x="80" y="1255" font-size="35" font-weight="700" fill="#fff" font-family="Noto Sans CJK JP,sans-serif">盛り付け・提供</text><text x="80" y="1301" font-size="32" font-weight="400" fill="#202b2c" font-family="Noto Sans CJK JP,sans-serif">木の皿に盛り付ける。</text><rect x="50" y="1381" width="980" height="65" rx="12" fill="#a51e29"/><text x="80" y="1426" font-size="35" font-weight="700" fill="#fff" font-family="Noto Sans CJK JP,sans-serif">注意点</text><text x="80" y="1475" font-size="32" font-weight="400" fill="#202b2c" font-family="Noto Sans CJK JP,sans-serif">・混ぜすぎると水っぽくなるので、半解凍くらいで仕上げる</text><text x="80" y="1522" font-size="32" font-weight="400" fill="#202b2c" font-family="Noto Sans CJK JP,sans-serif">。</text><text x="58" y="1628" font-size="23" font-weight="400" fill="#6b7882" font-family="Noto Sans CJK JP,sans-serif">Shisha Cafe &amp; Bar en ・ スタッフ用</text></svg>