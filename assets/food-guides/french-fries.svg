<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1551" viewBox="0 0 1080 1551"><rect width="1080" height="1551" fill="#ffffff"/><rect x="0" y="0" width="1080" height="190" rx="0" fill="#17262a"/><rect x="0" y="0" width="1080" height="18" rx="0" fill="#b62d32"/><text x="52" y="75" fill="#ffffff" font-size="36" font-weight="700" font-family="Noto Sans CJK JP, sans-serif">en  |  FOOD RECIPE</text><text x="52" y="153" fill="#ffffff" font-size="54" font-weight="700" font-family="Noto Sans CJK JP, sans-serif">03  山盛りポテト</text><rect x="50" y="224" width="980" height="106" rx="18" fill="#f6e6e6"/><text x="76" y="264" fill="#a51e29" font-size="28" font-weight="700" font-family="Noto Sans CJK JP, sans-serif">加熱・調理条件</text><text x="76" y="309" fill="#1b2530" font-size="30" font-weight="700" font-family="Noto Sans CJK JP, sans-serif">180℃・2分30秒</text><rect x="50" y="378" width="980" height="66" rx="12" fill="#b62d32"/><text x="77" y="423" fill="#fff" font-size="34" font-weight="700" font-family="Noto Sans CJK JP, sans-serif">材料・分量</text><text x="80" y="474" fill="#1b2530" font-size="31" font-weight="400" font-family="Noto Sans CJK JP, sans-serif">・冷凍ポテト 350g</text><text x="80" y="533" fill="#1b2530" font-size="31" font-weight="400" font-family="Noto Sans CJK JP, sans-serif">・各味付け粉</text><text x="80" y="592" fill="#1b2530" font-size="31" font-weight="400" font-family="Noto Sans CJK JP, sans-serif">・パセリ</text><text x="80" y="651" fill="#1b2530" font-size="31" font-weight="400" font-family="Noto Sans CJK JP, sans-serif">・ケチャップ／マヨ（味による）</text><rect x="50" y="732" width="980" height="66" rx="12" fill="#b62d32"/><text x="77" y="777" fill="#fff" font-size="34" font-weight="700" font-family="Noto Sans CJK JP, sans-serif">作り方</text><rect x="70" y="791" width="52" height="52" rx="26" fill="#b62d32"/><text x="86" y="828" fill="white" font-size="29" font-weight="700" font-family="Noto Sans CJK JP, sans-serif">1</text><text x="145" y="820" fill="#1b2530" font-size="31" font-weight="400" font-family="Noto Sans CJK JP, sans-serif">揚げ油180℃で冷凍ポテト350gを2分30秒揚げる。</text><rect x="70" y="870" width="52" height="52" rx="26" fill="#b62d32"/><text x="86" y="907" fill="white" font-size="29" font-weight="700" font-family="Noto Sans CJK JP, sans-serif">2</text><text x="145" y="899" fill="#1b2530" font-size="31" font-weight="400" font-family="Noto Sans CJK JP, sans-serif">キッチンペーパーを敷いたボウルに移し、油を切る。</text><rect x="70" y="949" width="52" height="52" rx="26" fill="#b62d32"/><text x="86" y="986" fill="white" font-size="29" font-weight="700" font-family="Noto Sans CJK JP, sans-serif">3</text><text x="145" y="978" fill="#1b2530" font-size="31" font-weight="400" font-family="Noto Sans CJK JP, sans-serif">味付け粉を全体にまぶして混ぜる。</text><rect x="70" y="1028" width="52" height="52" rx="26" fill="#b62d32"/><text x="86" y="1065" fill="white" font-size="29" font-weight="700" font-family="Noto Sans CJK JP, sans-serif">4</text><text x="145" y="1057" fill="#1b2530" font-size="31" font-weight="400" font-family="Noto Sans CJK JP, sans-serif">白い四角い大皿に盛り、パセリを振る。</text><rect x="50" y="1140" width="980" height="66" rx="12" fill="#b62d32"/><text x="77" y="1185" fill="#fff" font-size="34" font-weight="700" font-family="Noto Sans CJK JP, sans-serif">盛り付け・提供</text><text x="80" y="1236" fill="#1b2530" font-size="31" font-weight="400" font-family="Noto Sans CJK JP, sans-serif">白い四角い大皿。味に応じてケチャップ／マヨを添える。</text><rect x="50" y="1317" width="980" height="66" rx="12" fill="#b62d32"/><text x="77" y="1362" fill="#fff" font-size="34" font-weight="700" font-family="Noto Sans CJK JP, sans-serif">注意点</text><text x="80" y="1412" fill="#1b2530" font-size="31" font-weight="400" font-family="Noto Sans CJK JP, sans-serif">・熱いうちに味付けする。</text><text x="60" y="1516" fill="#6b7980" font-size="24" font-family="Noto Sans CJK JP,sans-serif">Shisha Cafe &amp; Bar en ・ スタッフ用</text></svg>