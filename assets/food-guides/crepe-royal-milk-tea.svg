<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1346" viewBox="0 0 1080 1346"><rect width="1080" height="1346" fill="white"/><rect x="0" y="0" width="1080" height="193" rx="0" fill="#17262a"/><rect x="0" y="0" width="1080" height="17" rx="0" fill="#a51e29"/><text x="55" y="75" font-size="35" font-weight="700" fill="#fff" font-family="Noto Sans CJK JP,sans-serif">en | FOOD RECIPE</text><text x="52" y="155" font-size="38" font-weight="700" fill="#fff" font-family="Noto Sans CJK JP,sans-serif">13  クレープ de ロイヤルミルクティー</text><rect x="50" y="225" width="980" height="110" rx="16" fill="#fbe8e8"/><text x="80" y="270" font-size="28" font-weight="700" fill="#9a1924" font-family="Noto Sans CJK JP,sans-serif">加熱・調理条件</text><text x="80" y="317" font-size="32" font-weight="700" fill="#202b2c" font-family="Noto Sans CJK JP,sans-serif">電子レンジ・30秒</text><rect x="50" y="380" width="980" height="65" rx="12" fill="#a51e29"/><text x="80" y="425" font-size="35" font-weight="700" fill="#fff" font-family="Noto Sans CJK JP,sans-serif">材料・分量</text><text x="80" y="476" font-size="32" font-weight="400" fill="#202b2c" font-family="Noto Sans CJK JP,sans-serif">・冷凍茶葉クレープ 1個</text><rect x="50" y="551" width="980" height="65" rx="12" fill="#a51e29"/><text x="80" y="596" font-size="35" font-weight="700" fill="#fff" font-family="Noto Sans CJK JP,sans-serif">作り方</text><rect x="70" y="612" width="55" height="52" rx="26" fill="#a51e29"/><text x="86" y="650" font-size="30" font-weight="700" fill="#fff" font-family="Noto Sans CJK JP,sans-serif">1</text><text x="148" y="642" font-size="32" font-weight="400" fill="#202b2c" font-family="Noto Sans CJK JP,sans-serif">冷凍クレープのフィルムを剥がす。</text><rect x="70" y="686" width="55" height="52" rx="26" fill="#a51e29"/><text x="86" y="724" font-size="30" font-weight="700" fill="#fff" font-family="Noto Sans CJK JP,sans-serif">2</text><text x="148" y="716" font-size="32" font-weight="400" fill="#202b2c" font-family="Noto Sans CJK JP,sans-serif">周囲の紙を丁寧に外して取っておく。</text><rect x="70" y="760" width="55" height="52" rx="26" fill="#a51e29"/><text x="86" y="798" font-size="30" font-weight="700" fill="#fff" font-family="Noto Sans CJK JP,sans-serif">3</text><text x="148" y="790" font-size="32" font-weight="400" fill="#202b2c" font-family="Noto Sans CJK JP,sans-serif">クレープを立ててレンジで30秒加熱する。</text><rect x="70" y="834" width="55" height="52" rx="26" fill="#a51e29"/><text x="86" y="872" font-size="30" font-weight="700" fill="#fff" font-family="Noto Sans CJK JP,sans-serif">4</text><text x="148" y="864" font-size="32" font-weight="400" fill="#202b2c" font-family="Noto Sans CJK JP,sans-serif">外した紙を巻き直しドリンクグラスに入れて提供する。</text><rect x="50" y="947" width="980" height="65" rx="12" fill="#a51e29"/><text x="80" y="992" font-size="35" font-weight="700" fill="#fff" font-family="Noto Sans CJK JP,sans-serif">盛り付け・提供</text><text x="80" y="1038" font-size="32" font-weight="400" fill="#202b2c" font-family="Noto Sans CJK JP,sans-serif">ドリンクグラスに立てて提供する。</text><rect x="50" y="1118" width="980" height="65" rx="12" fill="#a51e29"/><text x="80" y="1163" font-size="35" font-weight="700" fill="#fff" font-family="Noto Sans CJK JP,sans-serif">注意点</text><text x="80" y="1212" font-size="32" font-weight="400" fill="#202b2c" font-family="Noto Sans CJK JP,sans-serif">・解凍不足時は数秒ずつ追加。紙は丁寧に扱う。</text><text x="58" y="1318" font-size="23" font-weight="400" fill="#6b7882" font-family="Noto Sans CJK JP,sans-serif">Shisha Cafe &amp; Bar en ・ スタッフ用</text></svg>