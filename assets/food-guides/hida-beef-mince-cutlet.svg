<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1492" viewBox="0 0 1080 1492"><rect width="1080" height="1492" fill="#ffffff"/><rect x="0" y="0" width="1080" height="190" rx="0" fill="#17262a"/><rect x="0" y="0" width="1080" height="18" rx="0" fill="#b62d32"/><text x="52" y="75" fill="#ffffff" font-size="36" font-weight="700" font-family="Noto Sans CJK JP, sans-serif">en  |  FOOD RECIPE</text><text x="52" y="153" fill="#ffffff" font-size="54" font-weight="700" font-family="Noto Sans CJK JP, sans-serif">02  飛騨牛メンチカツ</text><rect x="50" y="224" width="980" height="106" rx="18" fill="#f6e6e6"/><text x="76" y="264" fill="#a51e29" font-size="28" font-weight="700" font-family="Noto Sans CJK JP, sans-serif">加熱・調理条件</text><text x="76" y="309" fill="#1b2530" font-size="30" font-weight="700" font-family="Noto Sans CJK JP, sans-serif">175℃・6分</text><rect x="50" y="378" width="980" height="66" rx="12" fill="#b62d32"/><text x="77" y="423" fill="#fff" font-size="34" font-weight="700" font-family="Noto Sans CJK JP, sans-serif">材料・分量</text><text x="80" y="474" fill="#1b2530" font-size="31" font-weight="400" font-family="Noto Sans CJK JP, sans-serif">・冷凍メンチカツ 3個</text><text x="80" y="533" fill="#1b2530" font-size="31" font-weight="400" font-family="Noto Sans CJK JP, sans-serif">・冷凍トマトソース</text><text x="80" y="592" fill="#1b2530" font-size="31" font-weight="400" font-family="Noto Sans CJK JP, sans-serif">・パセリ</text><rect x="50" y="673" width="980" height="66" rx="12" fill="#b62d32"/><text x="77" y="718" fill="#fff" font-size="34" font-weight="700" font-family="Noto Sans CJK JP, sans-serif">作り方</text><rect x="70" y="732" width="52" height="52" rx="26" fill="#b62d32"/><text x="86" y="769" fill="white" font-size="29" font-weight="700" font-family="Noto Sans CJK JP, sans-serif">1</text><text x="145" y="761" fill="#1b2530" font-size="31" font-weight="400" font-family="Noto Sans CJK JP, sans-serif">揚げ油175℃で冷凍メンチカツ3個を6分揚げる。</text><rect x="70" y="811" width="52" height="52" rx="26" fill="#b62d32"/><text x="86" y="848" fill="white" font-size="29" font-weight="700" font-family="Noto Sans CJK JP, sans-serif">2</text><text x="145" y="840" fill="#1b2530" font-size="31" font-weight="400" font-family="Noto Sans CJK JP, sans-serif">冷凍トマトソースを解凍する。</text><rect x="70" y="890" width="52" height="52" rx="26" fill="#b62d32"/><text x="86" y="927" fill="white" font-size="29" font-weight="700" font-family="Noto Sans CJK JP, sans-serif">3</text><text x="145" y="919" fill="#1b2530" font-size="31" font-weight="400" font-family="Noto Sans CJK JP, sans-serif">黒い小丸皿にトマトソースを敷き、メンチカツをのせる。</text><rect x="70" y="969" width="52" height="52" rx="26" fill="#b62d32"/><text x="86" y="1006" fill="white" font-size="29" font-weight="700" font-family="Noto Sans CJK JP, sans-serif">4</text><text x="145" y="998" fill="#1b2530" font-size="31" font-weight="400" font-family="Noto Sans CJK JP, sans-serif">パセリを振って提供する。</text><rect x="50" y="1081" width="980" height="66" rx="12" fill="#b62d32"/><text x="77" y="1126" fill="#fff" font-size="34" font-weight="700" font-family="Noto Sans CJK JP, sans-serif">盛り付け・提供</text><text x="80" y="1177" fill="#1b2530" font-size="31" font-weight="400" font-family="Noto Sans CJK JP, sans-serif">黒い小丸皿。ソースを先に敷いてからメンチカツを盛る。</text><rect x="50" y="1258" width="980" height="66" rx="12" fill="#b62d32"/><text x="77" y="1303" fill="#fff" font-size="34" font-weight="700" font-family="Noto Sans CJK JP, sans-serif">注意点</text><text x="80" y="1353" fill="#1b2530" font-size="31" font-weight="400" font-family="Noto Sans CJK JP, sans-serif">・高温で外側だけ焦がさない。中まで加熱されているか確認。</text><text x="60" y="1457" fill="#6b7980" font-size="24" font-family="Noto Sans CJK JP,sans-serif">Shisha Cafe &amp; Bar en ・ スタッフ用</text></svg>